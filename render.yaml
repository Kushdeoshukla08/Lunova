# Render Blueprint — Lunova STAGING, free tier, $0.
#
# What it gives you: one Dockerised web service on a `*.onrender.com` URL with
# HTTPS. The free instance SPINS DOWN after ~15 min idle and cold-starts in
# ~30–60 s — fine for scheduled, moderated user-testing sessions
# (docs/USER-TESTING.md), not for always-on traffic.
#
# NOT included (all $0 choices, see docs/STAGING-RUNBOOK.md):
#   • Database  → an external Neon free-tier Postgres. Paste its URL as DATABASE_URL.
#   • Storage   → STORAGE_PROVIDER=s3 against a Cloudflare R2 bucket (free tier:
#                 10 GB, no egress fees). Set the four S3_* secrets below. Leave
#                 STORAGE_PROVIDER=local and uploads live on the container's
#                 ephemeral disk instead — they vanish on every redeploy, which
#                 is why seeded persona photos 404 after a deploy.
#                 Keep the bucket PRIVATE: media is served through /media/[...key],
#                 which authorizes the viewer before redirecting to a signed URL.
#   • Email/SMS → console providers. During a moderated session the facilitator
#                 reads the 6-digit code from the Render logs. Phone verification
#                 is optional and skipped.
#   • Redis     → none. Single instance ⇒ in-process realtime + in-memory limits.
#
# Setup:
#   1. Create a Neon project (free), copy the pooled connection string.
#   2. In Render: New → Blueprint → point at this repo. It reads this file.
#   3. Fill the `sync: false` secrets when prompted (AUTH_SECRET, DATABASE_URL,
#      METRICS_TOKEN). Generate secrets with:  openssl rand -base64 48
#   4. Every deploy applies pending migrations on boot. The free tier has no
#      Shell and no pre-deploy hook, so the container is the only place they can
#      run; docker-entrypoint.sh does it before starting the server. Nothing to
#      configure. If you see a stale RUN_MIGRATIONS_ON_START on the service, it
#      is from an older revision and is ignored — delete it.
#   5. Seed once (see runbook): `npm run db:seed` then
#      `APP_ENV=staging SEED_STAGING=1 npm run db:seed:staging`.

services:
  - type: web
    name: lunova-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true            # redeploy on push to the connected branch
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: APP_URL
        value: https://lunova-staging.onrender.com   # edit if Render assigns another host
      # Uploads live on the container's ephemeral disk until an R2 bucket
      # exists — they vanish on every redeploy, which is why seeded persona
      # photos 404 after a deploy. To switch (see docs/PROVIDERS.md):
      #   1. Create a Cloudflare R2 bucket and an API token (free tier: 10 GB,
      #      no egress fees). Keep the bucket PRIVATE — /media authorizes each
      #      request and then redirects to a signed URL.
      #   2. Set the four S3_* secrets below in the Render dashboard.
      #   3. Flip this to `s3`.
      # /api/health reports storage.ready and names anything still missing, so
      # a half-done switch is visible from the probe rather than as broken
      # images.
      - key: STORAGE_PROVIDER
        value: local
      - key: S3_REGION
        value: auto            # correct for Cloudflare R2; use the real region for AWS
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: console
      - key: MODERATION_PROVIDER
        value: heuristic
      - key: MUSIC_PROVIDER
        value: internal
      - key: LOG_LEVEL
        value: info
      - key: SESSION_TTL_DAYS
        value: "30"
      # Render terminates TLS and appends the real peer to X-Forwarded-For, so
      # exactly one hop is trusted. Raise to 2 only if a CDN is put in front —
      # too high and a forged header becomes the rate-limit key.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # ── secrets: set these in the Render dashboard, never in git ──
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: METRICS_TOKEN
        sync: false
      # Object storage. Only needed once STORAGE_PROVIDER is flipped to `s3`;
      # /api/health names any that are still missing.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false            # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
