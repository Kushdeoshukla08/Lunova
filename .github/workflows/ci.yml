name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway secret for CI only — nothing real is protected by it.
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  NODE_ENV: test

jobs:
  # ── Fast gate: runs on every push and PR ──────────────────────────────────
  static:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # unit tests only — RUN_DB_TESTS unset
      - run: npm run build
        env:
          # build needs a syntactically-valid URL; nothing connects at build time
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  # ── DB integration: PR + main ────────────────────────────────────────────
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lunova
          POSTGRES_PASSWORD: lunova
          POSTGRES_DB: lunova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lunova"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lunova:lunova@localhost:5432/lunova_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed # reference data only
      - run: npm run test:db

  # ── End-to-end: main only (slower) ───────────────────────────────────────
  e2e:
    name: e2e (golden path)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lunova
          POSTGRES_PASSWORD: lunova
          POSTGRES_DB: lunova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lunova"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lunova:lunova@localhost:5432/lunova_test?schema=public
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: SEED_DEMO=1 npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Dependency advisory scan (informational; does not block) ─────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
